<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>嘻嘻小课堂 · 使用建议</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="page-bg">
    <div class="phone">
      <header class="topbar">
        <h1>使用建议</h1>
        <p class="sub">顺序规划 · 个人资源清晰流畅</p>
      </header>
      <main class="content">
        <div class="panel">
          <h3>推荐顺序</h3>
          <div id="steps"></div>
        </div>
        <div class="panel">
          <h3>播放说明</h3>
          <ul>
            <li>在系列详情中添加你自己的资源：本地视频、网盘/NAS 直链、<strong>B站收藏入口（默认偏好）</strong>、文件夹备忘。</li>
            <li>本地与直链优先页内播放，保证你自备清晰片源的流畅体验。</li>
            <li>B站等网页入口以外链打开，不内嵌不明来源。</li>
            <li>本工具不提供、不聚合任何片源，仅做导航与进度。</li>
          </ul>
        </div>
        <div class="panel">
          <h3>怎么用更稳</h3>
          <ul>
            <li>先把 SSS + Yakka Dee 听熟，再进情景动画。</li>
            <li>情景阶段可并行 Wow English 提兴趣，但不替代日常情景输入。</li>
            <li>进阶片语速与词汇更大，听力吃力就退回上一阶多听几周。</li>
          </ul>
        </div>
        <a class="btn btn-primary btn-block" href="index.html" style="display:block;text-align:center;margin-top:12px">返回首页</a>
      </main>
      <div id="nav"></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("nav").innerHTML = ENL.renderShell("home").navHtml;
    document.getElementById("steps").innerHTML = ENL_DATA.pathGuide.steps.map((s, i) => `
      <div class="guide-step">
        <div class="n">${i + 1}</div>
        <div><p>${s}</p></div>
      </div>`).join("") + `<p class="hint" style="margin-top:4px">${ENL_DATA.pathGuide.note}</p>`;
  </script>
</body>
</html>
